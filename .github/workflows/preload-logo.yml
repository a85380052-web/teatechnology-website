name: Preload current logo

on:
  push:
    paths:
      - '.github/workflows/preload-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch logo loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          logo = 'https://static.wixstatic.com/media/16d0ee_6327098e0dca4da18454c5d8b1e58bf3~mv2.jpg'
          marker = '<meta name="description" content="Teatechnology a Roma: assistenza, riparazione e manutenzione per smartphone e tablet.">'
          preload = marker + '\n<link rel="preconnect" href="https://static.wixstatic.com" crossorigin>\n<link rel="preload" as="image" href="' + logo + '" fetchpriority="high">'
          if '<link rel="preload" as="image" href="' + logo + '"' not in s:
              s = s.replace(marker, preload, 1)
          s = s.replace('<img id="logo" alt="Teatechnology logo">', '<img id="logo" src="' + logo + '" alt="Teatechnology logo" loading="eager" fetchpriority="high" decoding="async">', 1)
          s = s.replace('<img id="heroLogo" alt="Teatechnology">', '<img id="heroLogo" src="' + logo + '" alt="Teatechnology" loading="eager" fetchpriority="high" decoding="async">', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Preload logo before backend data"
          git push
