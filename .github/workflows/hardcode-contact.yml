name: Hardcode contact info

on:
  push:
    paths:
      - '.github/workflows/hardcode-contact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contact info
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span id="address"></span>', '<span id="address">Via Carlo Alberto, 59, 00185 Roma RM, Italia</span>', 1)
          s=s.replace('<span id="phone"></span>', '<span id="phone">+39 06 8892 1808</span>', 1)
          s=s.replace('<p id="contactAddress"></p>', '<p id="contactAddress">Via Carlo Alberto, 59, 00185 Roma RM, Italia</p>', 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show contact info immediately on first paint"
          git push
