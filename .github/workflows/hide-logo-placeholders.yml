name: Hide logo placeholders

on:
  push:
    paths:
      - '.github/workflows/hide-logo-placeholders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide placeholders and tighten header
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<img id="logo" hidden alt="">', '<img id="logo" hidden style="display:none!important" alt="">')
          s = s.replace('<img id="heroLogo" hidden alt="">', '<img id="heroLogo" hidden style="display:none!important" alt="">')
          if '[hidden]{display:none!important}' not in s:
              s = s.replace('*{box-sizing:border-box}', '*{box-sizing:border-box}[hidden]{display:none!important}')

          s = s.replace('.nav{height:150px;', '.nav{height:122px;')
          s = s.replace('.brand img{width:270px;height:135px;', '.brand img{width:235px;height:108px;')
          s = s.replace('@media(max-width:850px){nav{display:none}.nav{height:114px;', '@media(max-width:850px){nav{display:none}.nav{height:102px;')
          s = s.replace('.brand img{width:185px;height:96px}', '.brand img{width:172px;height:84px}')
          s = s.replace('@media(max-width:360px){.brand img{width:165px;height:90px}', '@media(max-width:360px){.brand img{width:155px;height:80px}')

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Tighten header spacing"
          git push
