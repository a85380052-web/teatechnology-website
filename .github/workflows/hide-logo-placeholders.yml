name: Hide logo placeholders

on:
  push:
    paths:
      - '.github/workflows/hide-logo-placeholders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide placeholders and align logo inside compact header
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          s = s.replace('<img id="logo" hidden alt="">', '<img id="logo" hidden style="display:none!important" alt="">')
          s = s.replace('<img id="heroLogo" hidden alt="">', '<img id="heroLogo" hidden style="display:none!important" alt="">')
          if '[hidden]{display:none!important}' not in s:
              s = s.replace('*{box-sizing:border-box}', '*{box-sizing:border-box}[hidden]{display:none!important}')

          # Keep the compact header and the existing logo size, but prevent the JPEG's white canvas
          # from extending into the blue hero area. Center the useful logo content inside the bar.
          s = s.replace('header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid var(--l);z-index:5}',
                        'header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid var(--l);z-index:5;overflow:hidden}')
          s = s.replace('.brand img{width:235px;height:108px;object-fit:contain;display:block}',
                        '.brand img{width:235px;height:108px;object-fit:contain;display:block;transform:translateY(-12px)}')

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Align logo within compact header"
          git push
