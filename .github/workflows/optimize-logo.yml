name: Optimize logo loading

on:
  push:
    paths:
      - '.github/workflows/optimize-logo.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = s
          s = s.replace(
              '<meta name="description" content="Teatechnology a Roma: assistenza, riparazione e manutenzione per smartphone e tablet.">',
              '<meta name="description" content="Teatechnology a Roma: assistenza, riparazione e manutenzione per smartphone e tablet.">\n<link rel="preload" as="image" href="./assets/teatechnology-logo.webp" fetchpriority="high">',
              1,
          )
          s = s.replace(
              '<img id="logo" alt="Teatechnology logo">',
              '<img id="logo" src="./assets/teatechnology-logo.webp" alt="Teatechnology logo" loading="eager" fetchpriority="high" decoding="async">',
              1,
          )
          s = s.replace(
              '<img id="heroLogo" alt="Teatechnology">',
              '<img id="heroLogo" src="./assets/teatechnology-logo.webp" alt="Teatechnology" loading="eager" fetchpriority="high" decoding="async">',
              1,
          )
          s = s.replace("logo.src=s.logo_url||'';heroLogo.src=s.logo_url||'';", '', 1)
          if s == old:
              raise SystemExit('No expected replacements were made')
          p.write_text(s)
          PY
      - name: Commit optimized loading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load logo immediately from local WebP"
          git push
