async function load(){[store,services,hours,prices,faqs,inq]=await Promise.all([rest('site_settings?singleton_key=eq.main&select=*').then(x=>x[0]||{}),rest('services?select=*&order=sort_order.asc'),rest('business_hours?select=*&order=day_of_week.asc'),restAll('repair_prices?select=*&order=brand.asc,device_type.asc,series.asc,model.asc,sort_order.asc,id.asc'),rest('faqs?select=*&order=sort_order.asc'),rest('inquiries?select=*&order=created_at.desc')]);render()}
function optionList(allLabel,values,current,lab=v=>v){return '<option value="">'+E(allLabel)+'</option>'+values.map(v=>'<option value="'+E(v)+'" '+(v===current?'selected':'')+'>'+E(lab(v))+'</option>').join('')}function nextSortOrder(brand,model,quality){let nums=prices.filter(x=>x.brand===brand&&x.model===model&&x.part_quality===quality).map(x=>Number(x.sort_order)||0);return (nums.length?Math.max(...nums):0)+1}
function renderPriceManager(){let b=priceBrandFilter.value||'',d=priceDeviceFilter.value||'',s=priceSeriesFilter.value||'',m=priceModelFilter.value||'',qf=priceQualityFilter.value||'',q=(priceSearch.value||'').trim().toLowerCase();let brands=[...new Set(prices.map(x=>x.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(b&&!brands.includes(b))b='';priceBrandFilter.innerHTML=optionList(t('allBrands'),brands,b);let byBrand=prices.filter(x=>!b||x.brand===b),devices=[...new Set(byBrand.map(x=>x.device_type).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(d&&!devices.includes(d))d='';priceDeviceFilter.innerHTML=optionList(t('allDevices'),devices,d);let byDevice=byBrand.filter(x=>!d||x.device_type===d),series=[...new Set(byDevice.map(x=>x.series).filter(Boolean))].sort((a,b)=>a.localeCompare(b));if(s&&!series.includes(s))s='';priceSeriesFilter.innerHTML=optionList(t('allSeries'),series,s);let bySeries=byDevice.filter(x=>!s||x.series===s),models=[...new Set(bySeries.map(x=>x.model).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(m&&!models.includes(m))m='';priceModelFilter.innerHTML=optionList(t('allModels'),models,m);let byModel=bySeries.filter(x=>!m||x.model===m),qualities=[...new Set(byModel.map(x=>x.part_quality).filter(Boolean))].sort((a,b)=>qualityRank(a)-qualityRank(b)||a.localeCompare(b));if(qf&&!qualities.includes(qf))qf='';priceQualityFilter.innerHTML=optionList(t('allQualities'),qualities,qf,qualityText);let rows=prices.filter(x=>(!b||x.brand===b)&&(!d||x.device_type===d)&&(!s||x.series===s)&&(!m||x.model===m)&&(!qf||x.part_quality===qf));if(q)rows=rows.filter(x=>[x.brand,x.device_type,x.series,x.model,x.part_quality,x.service_name_it,x.source_note].some(v=>String(v||'').toLowerCase().includes(q)));rows.sort((a,b)=>a.brand.localeCompare(b.brand)||a.device_type.localeCompare(b.device_type)||a.series.localeCompare(b.series,undefined,{numeric:true})||a.model.localeCompare(b.model,undefined,{numeric:true})||qualityRank(a.part_quality)-qualityRank(b.part_quality)||(Number(a.sort_order)||0)-(Number(b.sort_order)||0)||String(a.service_name_it||'').localeCompare(String(b.service_name_it||'')));priceCount.textContent=t('shown',rows.length);if(!rows.length){pricesList.innerHTML='<div class="price-empty">'+t('noPriceMatches')+'</div>';return}pricesList.innerHTML='<div class="table-wrap"><table class="price-table"><thead><tr><th>'+t('priceBrand')+'</th><th>'+t('device')+'</th><th>'+t('series')+'</th><th>'+t('model')+'</th><th>'+t('quality')+'</th><th>'+t('service')+'</th><th>'+t('price')+'</th><th>'+t('active')+'</th><th>'+t('actions')+'</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><input id="pb-'+p.id+'" value="'+E(p.brand)+'"></td><td><input id="pd-'+p.id+'" value="'+E(p.device_type)+'"></td><td><input id="ps-'+p.id+'" value="'+E(p.series)+'"></td><td><input class="model-input" id="pm-'+p.id+'" value="'+E(p.model)+'"></td><td><select class="quality-select" id="pq-'+p.id+'"><option value="originale" '+(p.part_quality==='originale'?'selected':'')+'>'+t('original')+'</option><option value="compatibile" '+(p.part_quality==='compatibile'?'selected':'')+'>'+t('compatible')+'</option></select></td><td><input class="service-input" id="pn-'+p.id+'" value="'+E(p.service_name_it)+'"><input class="note-input" id="px-'+p.id+'" value="'+E(p.source_note||'')+'" placeholder="'+E(t('source'))+'"></td><td><input class="price-input" id="pp-'+p.id+'" type="number" step="0.01" value="'+(p.price_eur==null?'':E(p.price_eur))+'"></td><td class="checkcell"><input id="pa-'+p.id+'" type="checkbox" '+(p.active?'checked':'')+'></td><td class="actioncell"><button class="btn" onclick="savePrice(\''+p.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delPrice(\''+p.id+'\')">'+t('delete')+'</button></td></tr>').join('')+'</tbody></table></div>'}
function render(){['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>$(k).value=store[k]||'');servicesList.innerHTML=services.map(s=>'<div class="item"><label>'+t('service')+'<input id="st-'+s.id+'" value="'+E(s.title_it)+'"></label><label>'+t('source')+'<textarea id="sd-'+s.id+'">'+E(s.description_it||'')+'</textarea></label><label><input id="sa-'+s.id+'" type="checkbox" '+(s.active?'checked':'')+'> '+t('visible')+'</label><div class="row"><button class="btn" onclick="saveService(\''+s.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delService(\''+s.id+'\')">'+t('delete')+'</button></div></div>').join('');let names=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];hoursList.innerHTML=names.slice(1).map((n,i)=>{let d=i+1,h=hours.find(x=>x.day_of_week===d)||{day_name_it:n,published:false};return '<div class="item"><strong>'+E(h.day_name_it||n)+'</strong><div class="formgrid"><label>'+t('start')+'<input id="ho-'+d+'" type="time" value="'+String(h.open_time||'').slice(0,5)+'"></label><label>'+t('end')+'<input id="hc-'+d+'" type="time" value="'+String(h.close_time||'').slice(0,5)+'"></label></div><label><input id="hp-'+d+'" type="checkbox" '+(h.published?'checked':'')+'> '+t('public')+'</label></div>'}).join('');renderPriceManager();faqsList.innerHTML=faqs.map(f=>'<div class="item"><label>'+t('question')+'<input id="fq-'+f.id+'" value="'+E(f.question_it)+'"></label><label>'+t('answer')+'<textarea id="fa-'+f.id+'">'+E(f.answer_it)+'</textarea></label><label><input id="fx-'+f.id+'" type="checkbox" '+(f.active?'checked':'')+'> '+t('visible')+'</label><div class="row"><button class="btn" onclick="saveFaq(\''+f.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delFaq(\''+f.id+'\')">'+t('delete')+'</button></div></div>').join('');inqList.innerHTML=inq.map(i=>'<div class="item"><strong>'+E(i.name||'-')+'</strong><p>'+E(i.phone||'')+' '+E(i.email||'')+'</p><p>'+E(i.device||'')+' priceBrandFilter.onchange=()=>{priceDeviceFilter.value='';priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';renderPriceManager()};priceDeviceFilter.onchange=()=>{priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';renderPriceManager()};priceSeriesFilter.onchange=()=>{priceModelFilter.value='';priceQualityFilter.value='';renderPriceManager()};priceModelFilter.onchange=()=>{priceQualityFilter.value='';renderPriceManager()};priceQualityFilter.onchange=renderPriceManager;priceSearch.oninput=renderPriceManager;clearPriceFilters.onclick=()=>{priceBrandFilter.value='';priceDeviceFilter.value='';priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';priceSearch.value='';renderPriceManager()};
async function loadAccounts(){accountsMsg.textContent='…';try{const [u,a]=await Promise.all([rest('user_directory?select=*&order=created_at.desc'),rest('admin_users?select=user_id,username')]),m=new Map(a.map(x=>[x.user_id,x.username||'']));accounts=u.map(x=>({...x,is_admin:m.has(x.user_id),username:m.get(x.user_id)||''}));renderAccounts()}catch(e){accountsMsg.textContent=e.message}}function renderAccounts(){accountsMsg.textContent=t('registered',accounts.length);accountsList.innerHTML=accounts.map(a=>{let self=user&&a.user_id===user.id,action=self?'<span class="muted">'+t('self')+'</span>':a.is_admin?'<button class="btn danger" onclick="setAdmin(\''+a.user_id+'\',false)">'+t('revoke')+'</button>':'<button class="btn" onclick="setAdmin(\''+a.user_id+'\',true)">'+t('approve')+'</button>',username=a.is_admin?'<div class="row" style="margin-top:10px"><input id="un-'+a.user_id+'" value="'+E(a.username||'')+'" placeholder="admin" style="max-width:220px"><button class="btn alt" onclick="saveUsername(\''+a.user_id+'\')">'+t('saveUsername')+'</button></div>':'';return '<div class="item"><div class="account-head"><div><strong>'+E(a.email||'-')+'</strong>'+username+'<div class="row" style="margin-top:8px"><span class="badge '+(a.email_confirmed?'ok':'no')+'">'+t(a.email_confirmed?'verified':'unverified')+'</span><span class="badge '+(a.is_admin?'ok':'')+'">'+t(a.is_admin?'admin':'normal')+'</span></div></div>'+action+'</div><p class="muted">'+E(new Date(a.created_at).toLocaleString(locale()))+'</p></div>'}).join('')}
window.saveUsername=async id=>{let v=$('un-'+id).value.trim();if(!/^[A-Za-z0-9._-]{3,32}$/.test(v)){accountsMsg.textContent=t('usernameInvalid');return}try{await rest('admin_users?user_id=eq.'+id,{method:'PATCH',body:{username:v}});accountsMsg.textContent=t('usernameSaved');if(user&&id===user.id)who.textContent=v;await loadAccounts()}catch(e){accountsMsg.textContent=e.message}};
window.setAdmin=async(id,on)=>{if(!confirm(on?t('confirmApprove'):t('confirmRevoke')))return;if(on){let a=accounts.find(x=>x.user_id===id),base=String(a&&a.email?a.email.split('@')[0]:'admin').replace(/[^A-Za-z0-9._-]/g,'').slice(0,32);if(base.length<3)base='admin';let username=prompt(t('usernamePrompt'),base);if(username===null)return;username=username.trim();if(!/^[A-Za-z0-9._-]{3,32}$/.test(username)){accountsMsg.textContent=t('usernameInvalid');return}await rest('admin_users',{method:'POST',body:{user_id:id,role:'admin',username}})}else await rest('admin_users?user_id=eq.'+id,{method:'DELETE'});loadAccounts()};forgotBtn.onclick=()=>{forgotBox.classList.toggle('hidden');forgotMsg.classList.add('hidden');if(!forgotBox.classList.contains('hidden')&&email.value.includes('@'))resetEmail.value=email.value.trim()};cancelForgot.onclick=()=>forgotBox.classList.add('hidden');sendReset.onclick=async()=>{let e=resetEmail.value.trim();forgotMsg.classList.remove('hidden');if(!e.includes('@')){forgotMsg.textContent=t('signupEmailOnly');return}try{sendReset.disabled=true;let redirect=location.origin+location.pathname;await auth('recover?redirect_to='+encodeURIComponent(redirect),{email:e});forgotMsg.textContent=t('resetSent')}catch(err){forgotMsg.textContent=err.message}finally{sendReset.disabled=false}};changePasswordBtn.onclick=async()=>{passwordMsg.classList.remove('hidden');let cur=currentPassword.value,np=newPassword.value,cp=confirmNewPassword.value;if(np.length<8){passwordMsg.textContent=t('passwordTooShort');return}if(np!==cp){passwordMsg.textContent=t('passwordMismatch');return}try{changePasswordBtn.disabled=true;let fresh=await auth('token?grant_type=password',{email:user.email,password:cur});await updatePassword(np,fresh.access_token);token=fresh.access_token;localStorage.setItem('tea_token',token);currentPassword.value='';newPassword.value='';confirmNewPassword.value='';passwordMsg.textContent=t('passwordChanged')}catch(err){passwordMsg.textContent=(String(err.message||'').toLowerCase().includes('invalid')||String(err.message||'').toLowerCase().includes('password'))?t('wrongCurrentPassword'):err.message}finally{changePasswordBtn.disabled=false}};resetPasswordBtn.onclick=async()=>{let a=recoveryPassword.value,b=recoveryPassword2.value;if(a.length<8){recoveryMsg.textContent=t('passwordTooShort');return}if(a!==b){recoveryMsg.textContent=t('passwordMismatch');return}try{resetPasswordBtn.disabled=true;await updatePassword(a,token);localStorage.removeItem('tea_token');token='';history.replaceState(null,'',location.pathname+location.search);resetView.style.display='none';login.style.display='grid';recoveryPassword.value='';recoveryPassword2.value='';msg.textContent=t('passwordChangedLogin')}catch(err){recoveryMsg.textContent=err.message}finally{resetPasswordBtn.disabled=false}};loginBtn.onclick=async()=>{try{let id=email.value.trim(),j=id.includes('@')?await auth('token?grant_type=password',{email:id,password:password.value}):await authUsername(id,password.value);token=j.access_token;localStorage.setItem('tea_token',token);boot()}catch(e){msg.textContent=e.message}};signupBtn.onclick=async()=>{try{let id=email.value.trim();if(!id.includes('@'))throw Error(t('signupEmailOnly'));await auth('signup',{email:id,password:password.value});msg.textContent=t('signupOk')}catch(e){msg.textContent=e.message}};logoutBtn.onclick=()=>{localStorage.removeItem('tea_token');location.reload()};nav.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));$(e.target.dataset.tab).classList.add('active');if(e.target.dataset.tab==='accounts')loadAccounts()};refreshAccounts.onclick=loadAccounts;
saveStore.onclick=async()=>{let b={};['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>b[k]=$(k).value.trim());await rest('site_settings?singleton_key=eq.main',{method:'PATCH',body:b});storeMsg.textContent=t('saved');load()};addService.onclick=async()=>{await rest('services',{method:'POST',body:{title_it:'Nuovo servizio',description_it:'',sort_order:services.length+1,active:true}});load()};window.saveService=async id=>{await rest('services?id=eq.'+id,{method:'PATCH',body:{title_it:$('st-'+id).value,description_it:$('sd-'+id).value,active:$('sa-'+id).checked}});load()};window.delService=async id=>{if(confirm(t('confirmDelete'))){await rest('services?id=eq.'+id,{method:'DELETE'});load()}};saveHours.onclick=async()=>{let n=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];for(let d=1;d<=7;d++){let ex=hours.find(x=>x.day_of_week===d),b={day_of_week:d,day_name_it:n[d],open_time:$('ho-'+d).value||null,close_time:$('hc-'+d).value||null,published:$('hp-'+d).checked,sort_order:d};if(ex)await rest('business_hours?id=eq.'+ex.id,{method:'PATCH',body:b});else await rest('business_hours',{method:'POST',body:b})}load()};addPrice.onclick=async()=>{let brand='Apple',model='Nuovo modello',quality='originale';await rest('repair_prices',{method:'POST',body:{brand,device_type:'iPhone',series:'iPhone 16',model,part_quality:quality,service_key:'service_'+Date.now(),service_name_it:'Nuovo servizio',price_eur:null,sort_order:nextSortOrder(brand,model,quality),active:false}});priceBrandFilter.value='';priceDeviceFilter.value='';priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';priceSearch.value='';load()};window.savePrice=async id=>{let pv=$('pp-'+id).value.trim();await rest('repair_prices?id=eq.'+id,{method:'PATCH',body:{brand:$('pb-'+id).value.trim(),device_type:$('pd-'+id).value.trim(),series:$('ps-'+id).value.trim(),model:$('pm-'+id).value.trim(),part_quality:$('pq-'+id).value,service_name_it:$('pn-'+id).value.trim(),price_eur:pv===''?null:Number(pv),source_note:$('px-'+id).value.trim(),active:$('pa-'+id).checked}});load()};window.delPrice=async id=>{if(confirm(t('confirmDelete'))){await rest('repair_prices?id=eq.'+id,{method:'DELETE'});load()}};addFaq.onclick=async()=>{await rest('faqs',{method:'POST',body:{question_it:'Nuova domanda',answer_it:'Nuova risposta',sort_order:faqs.length+1,active:true}});load()};window.saveFaq=async id=>{await rest('faqs?id=eq.'+id,{method:'PATCH',body:{question_it:$('fq-'+id).value,answer_it:$('fa-'+id).value,active:$('fx-'+id).checked}});load()};window.delFaq=async id=>{if(confirm(t('confirmDelete'))){await rest('faqs?id=eq.'+id,{method:'DELETE'});load()}};window.setInq=async(id,status)=>{await rest('inquiries?id=eq.'+id,{method:'PATCH',body:{status}});load()};function initRecovery(){let p=new URLSearchParams(location.hash.replace(/^#/,'')),recovery=p.get('type')==='recovery',access=p.get('access_token');if(recovery&&access){token=access;localStorage.setItem('tea_token',token);login.style.display='none';app.style.display='none';resetView.style.display='grid';recoveryMsg.textContent=t('setNewPassword');return true}return false}applyLanguage();if(!initRecovery()&&token)boot();
