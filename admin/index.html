<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teatechnology 管理后台</title>
<style>
:root{--b:#123b7a;--c:#20b9c9;--l:#dce9f2;--m:#657b8d;--bg:#f5fbff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:#17324d}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}
.card,.panel,.nav{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px}.login .card{width:min(460px,100%)}
h1,h2{color:var(--b)}label{display:grid;gap:6px;font-weight:700;font-size:14px;margin-bottom:12px}
input,textarea,select{border:1px solid #cddde8;border-radius:11px;padding:11px;font:inherit}
.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(90deg,var(--b),var(--c));color:#fff;font-weight:800;cursor:pointer}
.alt{background:#edf8fd;color:var(--b)}.danger{background:#fff1f0;color:#a52b20}.muted{color:var(--m);font-size:13px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{background:#fff;border-bottom:1px solid var(--l);padding:16px 0}
.top .wrap{display:flex;justify-content:space-between;align-items:center}.main{padding:24px 0 50px}.grid{display:grid;grid-template-columns:220px 1fr;gap:20px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;cursor:pointer}.nav button.active{background:#eaf8fd;color:var(--b);font-weight:800}
.sec{display:none}.sec.active{display:block}.item{border:1px solid var(--l);border-radius:13px;padding:13px;margin-top:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{background:#f0f7fa;border-radius:10px;padding:10px;color:var(--m);margin-top:10px}
.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#edf8fd;color:var(--b)}
.badge.ok{background:#ecfbf2;color:#147a45}.badge.no{background:#fff1f0;color:#a52b20}
.account-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
@media(max-width:780px){.grid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top .wrap{align-items:flex-start;gap:10px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <h1>Teatechnology</h1><p>简体中文管理后台</p>
    <label>邮箱<input id="email" type="email"></label>
    <label>密码<input id="password" type="password"></label>
    <div class="row"><button id="loginBtn" class="btn">登录</button><button id="signupBtn" class="btn alt">首次注册</button></div>
    <div id="msg" class="msg">第一次使用请先注册。</div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top"><div class="wrap"><strong>Teatechnology 管理后台</strong><div><span id="who"></span> <button id="logoutBtn" class="btn alt">退出</button></div></div></div>
  <div class="wrap main"><div class="grid">
    <div id="nav" class="nav">
      <button class="active" data-tab="store">门店资料</button>
      <button data-tab="services">服务项目</button>
      <button data-tab="hours">营业时间</button>
      <button data-tab="faqs">FAQ</button>
      <button data-tab="inq">客户询价</button>
      <button data-tab="accounts">账号管理</button>
    </div>
    <div>
      <section id="store" class="panel sec active">
        <h2>门店资料</h2>
        <div class="formgrid"><label>品牌<input id="brand_name"></label><label>电话<input id="phone"></label></div>
        <label>地址<input id="address"></label>
        <label>首页主标题（意大利语）<input id="hero_title_it"></label>
        <label>首页副标题（意大利语）<textarea id="hero_subtitle_it" rows="3"></textarea></label>
        <label>Logo URL<input id="logo_url"></label>
        <button id="saveStore" class="btn">保存</button><div id="storeMsg" class="msg"></div>
      </section>

      <section id="services" class="panel sec">
        <div class="row"><h2>服务项目</h2><button id="addService" class="btn">新增</button></div><div id="servicesList"></div>
      </section>

      <section id="hours" class="panel sec">
        <h2>营业时间</h2><div id="hoursList"></div><button id="saveHours" class="btn">保存</button>
      </section>

      <section id="faqs" class="panel sec">
        <div class="row"><h2>FAQ</h2><button id="addFaq" class="btn">新增</button></div><div id="faqsList"></div>
      </section>

      <section id="inq" class="panel sec">
        <h2>客户询价</h2><div id="inqList"></div>
      </section>

      <section id="accounts" class="panel sec">
        <div class="account-head"><div><h2 style="margin-top:0">账号管理</h2><p class="muted">只有已经注册的账号会出现在这里。批准后才能进入管理后台。</p></div><button id="refreshAccounts" class="btn alt">刷新</button></div>
        <div id="accountsMsg" class="msg">正在读取账号…</div>
        <div id="accountsList"></div>
      </section>
    </div>
  </div></div>
</div>

<script>
const SB='https://pgnbacjlgnzmcsgfdxrn.supabase.co',KEY='sb_publishable_zMSq9XcCU_mChMK6hDuQLQ_vIP_jbaT';
let token=localStorage.getItem('tea_token')||'',user,store={},services=[],hours=[],faqs=[],inq=[],accounts=[];
const $=x=>document.getElementById(x);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=()=>{let h={apikey:KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h};
async function auth(p,b){let r=await fetch(SB+'/auth/v1/'+p,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.msg||j.message||'操作失败');return j}
async function rest(p,o={}){let r=await fetch(SB+'/rest/v1/'+p,{method:o.method||'GET',headers:H(),body:o.body!==undefined?JSON.stringify(o.body):undefined});if(!r.ok)throw Error(await r.text());if(r.status===204)return null;let t=await r.text();return t?JSON.parse(t):null}
async function rpc(name,body={}){return rest('rpc/'+name,{method:'POST',body})}
async function me(){let r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)throw Error('登录已过期');return r.json()}
async function boot(){try{user=await me();let a=await rest('admin_users?select=user_id&user_id=eq.'+user.id);if(!a.length){msg.textContent='账号已注册，但还没有管理员权限。请让现有管理员在“账号管理”里批准。';localStorage.removeItem('tea_token');token='';return}login.style.display='none';app.style.display='block';who.textContent=user.email||'';await load()}catch(e){msg.textContent=e.message}}
async function load(){[store,services,hours,faqs,inq]=await Promise.all([rest('site_settings?singleton_key=eq.main&select=*').then(x=>x[0]),rest('services?select=*&order=sort_order.asc'),rest('business_hours?select=*&order=day_of_week.asc'),rest('faqs?select=*&order=sort_order.asc'),rest('inquiries?select=*&order=created_at.desc')]);render()}
function render(){['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>$(k).value=store[k]||'');servicesList.innerHTML=services.map(s=>'<div class="item"><label>标题<input id="st-'+s.id+'" value="'+E(s.title_it)+'"></label><label>说明<textarea id="sd-'+s.id+'">'+E(s.description_it||'')+'</textarea></label><label><input id="sa-'+s.id+'" type="checkbox" '+(s.active?'checked':'')+'> 网站显示</label><div class="row"><button class="btn" onclick="saveService(\''+s.id+'\')">保存</button><button class="btn danger" onclick="delService(\''+s.id+'\')">删除</button></div></div>').join('');let names=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];hoursList.innerHTML=names.slice(1).map((n,i)=>{let d=i+1,h=hours.find(x=>x.day_of_week===d)||{day_of_week:d,day_name_it:n,published:false,open_time:'',close_time:''};return '<div class="item"><strong>'+h.day_name_it+'</strong><div class="formgrid"><label>开始<input id="ho-'+d+'" type="time" value="'+String(h.open_time||'').slice(0,5)+'"></label><label>结束<input id="hc-'+d+'" type="time" value="'+String(h.close_time||'').slice(0,5)+'"></label></div><label><input id="hp-'+d+'" type="checkbox" '+(h.published?'checked':'')+'> 对外显示</label></div>'}).join('');faqsList.innerHTML=faqs.map(f=>'<div class="item"><label>问题<input id="fq-'+f.id+'" value="'+E(f.question_it)+'"></label><label>回答<textarea id="fa-'+f.id+'">'+E(f.answer_it)+'</textarea></label><label><input id="fx-'+f.id+'" type="checkbox" '+(f.active?'checked':'')+'> 网站显示</label><div class="row"><button class="btn" onclick="saveFaq(\''+f.id+'\')">保存</button><button class="btn danger" onclick="delFaq(\''+f.id+'\')">删除</button></div></div>').join('');inqList.innerHTML=inq.map(i=>'<div class="item"><strong>'+E(i.name||'未填写姓名')+'</strong><p>'+E(i.phone||'')+' '+E(i.email||'')+'</p><p>'+E(i.device||'')+'<br>'+E(i.message||'')+'</p><label>状态<select onchange="setInq(\''+i.id+'\',this.value)"><option value="new" '+(i.status==='new'?'selected':'')+'>新询价</option><option value="contacted" '+(i.status==='contacted'?'selected':'')+'>已联系</option><option value="closed" '+(i.status==='closed'?'selected':'')+'>已完成</option></select></label></div>').join('')||'<p>暂无询价</p>'}
async function loadAccounts(){accountsMsg.textContent='正在读取账号…';try{accounts=await rpc('list_registered_users');accountsMsg.textContent='共 '+accounts.length+' 个注册账号';accountsList.innerHTML=accounts.map(a=>{const self=user&&a.user_id===user.id;const verified=a.email_confirmed?'<span class="badge ok">邮箱已验证</span>':'<span class="badge no">邮箱未验证</span>';const admin=a.is_admin?'<span class="badge ok">管理员</span>':'<span class="badge">普通账号</span>';let action='';if(self)action='<span class="muted">当前登录账号，不能撤销自己的权限</span>';else if(a.is_admin)action='<button class="btn danger" onclick="setAdmin(\''+a.user_id+'\',false)">撤销管理员</button>';else action='<button class="btn" onclick="setAdmin(\''+a.user_id+'\',true)">批准为管理员</button>';return '<div class="item"><div class="account-head"><div><strong>'+E(a.email||'无邮箱')+'</strong><div class="row" style="margin-top:8px">'+verified+admin+'</div></div><div>'+action+'</div></div><p class="muted">注册时间：'+E(new Date(a.created_at).toLocaleString('zh-CN'))+(a.last_sign_in_at?'　最近登录：'+E(new Date(a.last_sign_in_at).toLocaleString('zh-CN')):'')+'</p></div>'}).join('')||'<p>暂无账号</p>'}catch(e){accountsMsg.textContent='读取失败：'+e.message}}
window.setAdmin=async(id,enabled)=>{if(!confirm(enabled?'确定批准这个账号成为管理员？':'确定撤销这个账号的管理员权限？'))return;try{await rpc('set_admin_access',{target_user_id:id,enabled});await loadAccounts()}catch(e){alert(e.message)}};
loginBtn.onclick=async()=>{try{let j=await auth('token?grant_type=password',{email:email.value.trim(),password:password.value});token=j.access_token;localStorage.setItem('tea_token',token);await boot()}catch(e){msg.textContent=e.message}};
signupBtn.onclick=async()=>{try{let j=await auth('signup',{email:email.value.trim(),password:password.value});msg.textContent=j.session?'注册成功，正在检查权限…':'注册成功，请先完成邮箱确认再登录。';if(j.session){token=j.session.access_token;localStorage.setItem('tea_token',token);await boot()}}catch(e){msg.textContent=e.message}};
logoutBtn.onclick=()=>{localStorage.removeItem('tea_token');location.reload()};nav.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));$(e.target.dataset.tab).classList.add('active');if(e.target.dataset.tab==='accounts')loadAccounts()};refreshAccounts.onclick=loadAccounts;
saveStore.onclick=async()=>{let b={};['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>b[k]=$(k).value.trim());await rest('site_settings?singleton_key=eq.main',{method:'PATCH',body:b});storeMsg.textContent='已保存';await load()};addService.onclick=async()=>{await rest('services',{method:'POST',body:{title_it:'Nuovo servizio',description_it:'',sort_order:services.length+1,active:true}});await load()};window.saveService=async id=>{await rest('services?id=eq.'+id,{method:'PATCH',body:{title_it:$('st-'+id).value,description_it:$('sd-'+id).value,active:$('sa-'+id).checked}});await load()};window.delService=async id=>{if(confirm('确定删除？')){await rest('services?id=eq.'+id,{method:'DELETE'});await load()}};saveHours.onclick=async()=>{let names=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];for(let d=1;d<=7;d++){let ex=hours.find(x=>x.day_of_week===d),b={day_of_week:d,day_name_it:names[d],open_time:$('ho-'+d).value||null,close_time:$('hc-'+d).value||null,published:$('hp-'+d).checked,sort_order:d};if(ex)await rest('business_hours?id=eq.'+ex.id,{method:'PATCH',body:b});else await rest('business_hours',{method:'POST',body:b})}await load()};addFaq.onclick=async()=>{await rest('faqs',{method:'POST',body:{question_it:'Nuova domanda',answer_it:'Nuova risposta',sort_order:faqs.length+1,active:true}});await load()};window.saveFaq=async id=>{await rest('faqs?id=eq.'+id,{method:'PATCH',body:{question_it:$('fq-'+id).value,answer_it:$('fa-'+id).value,active:$('fx-'+id).checked}});await load()};window.delFaq=async id=>{if(confirm('确定删除？')){await rest('faqs?id=eq.'+id,{method:'DELETE'});await load()}};window.setInq=async(id,status)=>{await rest('inquiries?id=eq.'+id,{method:'PATCH',body:{status}});await load()};if(token)boot();
</script>
</body></html>
