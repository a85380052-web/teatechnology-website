<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teatechnology 管理后台</title>
<style>
:root{--b:#123b7a;--c:#20b9c9;--l:#dce9f2;--m:#657b8d;--bg:#f5fbff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:#17324d}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center;position:relative}
.card,.panel,.nav{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px}.login .card{width:min(460px,100%)}
h1,h2{color:var(--b)}label{display:grid;gap:6px;font-weight:700;font-size:14px;margin-bottom:12px}
input,textarea,select{border:1px solid #cddde8;border-radius:11px;padding:11px;font:inherit}
.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(90deg,var(--b),var(--c));color:#fff;font-weight:800;cursor:pointer}
.alt{background:#edf8fd;color:var(--b)}.danger{background:#fff1f0;color:#a52b20}.muted{color:var(--m);font-size:13px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.top{background:#fff;border-bottom:1px solid var(--l);padding:16px 0}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px}.main{padding:24px 0 50px}.grid{display:grid;grid-template-columns:220px 1fr;gap:20px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;cursor:pointer}.nav button.active{background:#eaf8fd;color:var(--b);font-weight:800}
.sec{display:none}.sec.active{display:block}.item{border:1px solid var(--l);border-radius:13px;padding:13px;margin-top:10px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{background:#f0f7fa;border-radius:10px;padding:10px;color:var(--m);margin-top:10px}
.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#edf8fd;color:var(--b)}
.badge.ok{background:#ecfbf2;color:#147a45}.badge.no{background:#fff1f0;color:#a52b20}
.account-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.lang-wrap{display:flex;align-items:center;gap:8px}.lang-select{min-width:132px;background:#fff;color:var(--b);font-weight:700;padding:9px 10px}
.login-lang{position:absolute;top:18px;right:18px;z-index:2}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:780px){.grid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top .wrap{align-items:flex-start;gap:10px}.top-actions{justify-content:flex-start}.login-lang{top:12px;right:12px}.lang-select{min-width:118px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-lang lang-wrap"><select id="langLogin" class="lang-select" aria-label="Language"><option value="zh">简体中文</option><option value="it">Italiano</option><option value="en">English</option></select></div>
  <div class="card">
    <h1>Teatechnology</h1><p data-i18n="adminSubtitle">简体中文管理后台</p>
    <label><span data-i18n="email">邮箱</span><input id="email" type="email"></label>
    <label><span data-i18n="password">密码</span><input id="password" type="password"></label>
    <div class="row"><button id="loginBtn" class="btn" data-i18n="login">登录</button><button id="signupBtn" class="btn alt" data-i18n="signup">首次注册</button></div>
    <div id="msg" class="msg" data-i18n="firstUse">第一次使用请先注册。</div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top"><div class="wrap"><strong data-i18n="adminTitle">Teatechnology 管理后台</strong><div class="top-actions"><div class="lang-wrap"><select id="langApp" class="lang-select" aria-label="Language"><option value="zh">简体中文</option><option value="it">Italiano</option><option value="en">English</option></select></div><span id="who"></span><button id="logoutBtn" class="btn alt" data-i18n="logout">退出</button></div></div></div>
  <div class="wrap main"><div class="grid">
    <div id="nav" class="nav">
      <button class="active" data-tab="store" data-i18n="navStore">门店资料</button>
      <button data-tab="services" data-i18n="navServices">服务项目</button>
      <button data-tab="hours" data-i18n="navHours">营业时间</button>
      <button data-tab="faqs">FAQ</button>
      <button data-tab="inq" data-i18n="navInq">客户询价</button>
      <button data-tab="accounts" data-i18n="navAccounts">账号管理</button>
    </div>
    <div>
      <section id="store" class="panel sec active">
        <h2 data-i18n="storeTitle">门店资料</h2>
        <div class="formgrid"><label><span data-i18n="brand">品牌</span><input id="brand_name"></label><label><span data-i18n="phone">电话</span><input id="phone"></label></div>
        <label><span data-i18n="address">地址</span><input id="address"></label>
        <label><span data-i18n="heroTitleIt">首页主标题（意大利语）</span><input id="hero_title_it"></label>
        <label><span data-i18n="heroSubtitleIt">首页副标题（意大利语）</span><textarea id="hero_subtitle_it" rows="3"></textarea></label>
        <label>Logo URL<input id="logo_url"></label>
        <button id="saveStore" class="btn" data-i18n="save">保存</button><div id="storeMsg" class="msg"></div>
      </section>

      <section id="services" class="panel sec">
        <div class="row"><h2 data-i18n="servicesTitle">服务项目</h2><button id="addService" class="btn" data-i18n="add">新增</button></div><div id="servicesList"></div>
      </section>

      <section id="hours" class="panel sec">
        <h2 data-i18n="hoursTitle">营业时间</h2><div id="hoursList"></div><button id="saveHours" class="btn" data-i18n="save">保存</button>
      </section>

      <section id="faqs" class="panel sec">
        <div class="row"><h2>FAQ</h2><button id="addFaq" class="btn" data-i18n="add">新增</button></div><div id="faqsList"></div>
      </section>

      <section id="inq" class="panel sec">
        <h2 data-i18n="inqTitle">客户询价</h2><div id="inqList"></div>
      </section>

      <section id="accounts" class="panel sec">
        <div class="account-head"><div><h2 style="margin-top:0" data-i18n="accountsTitle">账号管理</h2><p class="muted" data-i18n="accountsDesc">只有已经注册的账号会出现在这里。批准后才能进入管理后台。</p></div><button id="refreshAccounts" class="btn alt" data-i18n="refresh">刷新</button></div>
        <div id="accountsMsg" class="msg" data-i18n="loadingAccounts">正在读取账号…</div>
        <div id="accountsList"></div>
      </section>
    </div>
  </div></div>
</div>

<script>
const SB='https://pgnbacjlgnzmcsgfdxrn.supabase.co',KEY='sb_publishable_zMSq9XcCU_mChMK6hDuQLQ_vIP_jbaT';
let token=localStorage.getItem('tea_token')||'',user,store={},services=[],hours=[],faqs=[],inq=[],accounts=[];
let lang=localStorage.getItem('tea_admin_lang')||'zh';
const $=x=>document.getElementById(x);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I18N={
zh:{adminTitle:'Teatechnology 管理后台',adminSubtitle:'简体中文管理后台',email:'邮箱',password:'密码',login:'登录',signup:'首次注册',firstUse:'第一次使用请先注册。',logout:'退出',navStore:'门店资料',navServices:'服务项目',navHours:'营业时间',navInq:'客户询价',navAccounts:'账号管理',storeTitle:'门店资料',brand:'品牌',phone:'电话',address:'地址',heroTitleIt:'首页主标题（意大利语）',heroSubtitleIt:'首页副标题（意大利语）',save:'保存',saved:'已保存',servicesTitle:'服务项目',add:'新增',title:'标题',description:'说明',websiteVisible:'网站显示',delete:'删除',hoursTitle:'营业时间',start:'开始',end:'结束',publicVisible:'对外显示',question:'问题',answer:'回答',inqTitle:'客户询价',noName:'未填写姓名',status:'状态',newInq:'新询价',contacted:'已联系',closed:'已完成',noInq:'暂无询价',accountsTitle:'账号管理',accountsDesc:'只有已经注册的账号会出现在这里。批准后才能进入管理后台。',refresh:'刷新',loadingAccounts:'正在读取账号…',registeredCount:n=>'共 '+n+' 个注册账号',emailVerified:'邮箱已验证',emailUnverified:'邮箱未验证',admin:'管理员',normalAccount:'普通账号',selfAccount:'当前登录账号，不能撤销自己的权限',revokeAdmin:'撤销管理员',approveAdmin:'批准为管理员',createdAt:'注册时间',lastLogin:'最近登录',noEmail:'无邮箱',noAccounts:'暂无账号',readFailed:'读取失败',confirmApprove:'确定批准这个账号成为管理员？',confirmRevoke:'确定撤销这个账号的管理员权限？',confirmDelete:'确定删除？',operationFailed:'操作失败',expired:'登录已过期',noPermission:'账号已注册，但还没有管理员权限。请让现有管理员在“账号管理”里批准。',signupChecking:'注册成功，正在检查权限…',signupConfirm:'注册成功，请先完成邮箱确认再登录。'},
it:{adminTitle:'Pannello amministrativo Teatechnology',adminSubtitle:'Pannello amministrativo',email:'Email',password:'Password',login:'Accedi',signup:'Prima registrazione',firstUse:'Al primo utilizzo, registrati prima.',logout:'Esci',navStore:'Dati negozio',navServices:'Servizi',navHours:'Orari',navInq:'Richieste clienti',navAccounts:'Gestione account',storeTitle:'Dati negozio',brand:'Marchio',phone:'Telefono',address:'Indirizzo',heroTitleIt:'Titolo principale homepage (italiano)',heroSubtitleIt:'Sottotitolo homepage (italiano)',save:'Salva',saved:'Salvato',servicesTitle:'Servizi',add:'Aggiungi',title:'Titolo',description:'Descrizione',websiteVisible:'Visibile sul sito',delete:'Elimina',hoursTitle:'Orari di apertura',start:'Apertura',end:'Chiusura',publicVisible:'Mostra pubblicamente',question:'Domanda',answer:'Risposta',inqTitle:'Richieste clienti',noName:'Nome non indicato',status:'Stato',newInq:'Nuova richiesta',contacted:'Contattato',closed:'Completata',noInq:'Nessuna richiesta',accountsTitle:'Gestione account',accountsDesc:'Qui compaiono solo gli account già registrati. Devono essere approvati per accedere al pannello.',refresh:'Aggiorna',loadingAccounts:'Caricamento account…',registeredCount:n=>n+' account registrati',emailVerified:'Email verificata',emailUnverified:'Email non verificata',admin:'Amministratore',normalAccount:'Account normale',selfAccount:'Account attualmente connesso: non puoi revocare i tuoi permessi',revokeAdmin:'Revoca amministratore',approveAdmin:'Approva come amministratore',createdAt:'Registrato il',lastLogin:'Ultimo accesso',noEmail:'Nessuna email',noAccounts:'Nessun account',readFailed:'Errore di lettura',confirmApprove:'Confermi di voler approvare questo account come amministratore?',confirmRevoke:'Confermi di voler revocare i permessi amministratore?',confirmDelete:'Confermi di voler eliminare?',operationFailed:'Operazione non riuscita',expired:'Sessione scaduta',noPermission:'L’account è registrato ma non ha ancora i permessi di amministratore. Chiedi a un amministratore esistente di approvarlo in “Gestione account”.',signupChecking:'Registrazione completata. Verifica dei permessi…',signupConfirm:'Registrazione completata. Conferma prima l’email, poi accedi.'},
en:{adminTitle:'Teatechnology Admin Panel',adminSubtitle:'Administration panel',email:'Email',password:'Password',login:'Sign in',signup:'First-time sign up',firstUse:'If this is your first time, please sign up first.',logout:'Sign out',navStore:'Store details',navServices:'Services',navHours:'Business hours',navInq:'Customer inquiries',navAccounts:'Account management',storeTitle:'Store details',brand:'Brand',phone:'Phone',address:'Address',heroTitleIt:'Homepage main title (Italian)',heroSubtitleIt:'Homepage subtitle (Italian)',save:'Save',saved:'Saved',servicesTitle:'Services',add:'Add',title:'Title',description:'Description',websiteVisible:'Show on website',delete:'Delete',hoursTitle:'Business hours',start:'Open',end:'Close',publicVisible:'Show publicly',question:'Question',answer:'Answer',inqTitle:'Customer inquiries',noName:'Name not provided',status:'Status',newInq:'New inquiry',contacted:'Contacted',closed:'Completed',noInq:'No inquiries',accountsTitle:'Account management',accountsDesc:'Only registered accounts appear here. They must be approved before they can access the admin panel.',refresh:'Refresh',loadingAccounts:'Loading accounts…',registeredCount:n=>n+' registered accounts',emailVerified:'Email verified',emailUnverified:'Email not verified',admin:'Administrator',normalAccount:'Standard account',selfAccount:'Current signed-in account; you cannot revoke your own permissions',revokeAdmin:'Revoke admin',approveAdmin:'Approve as admin',createdAt:'Registered',lastLogin:'Last sign-in',noEmail:'No email',noAccounts:'No accounts',readFailed:'Failed to load',confirmApprove:'Approve this account as an administrator?',confirmRevoke:'Revoke administrator access from this account?',confirmDelete:'Are you sure you want to delete this?',operationFailed:'Operation failed',expired:'Session expired',noPermission:'This account is registered but does not have administrator access yet. Ask an existing administrator to approve it under “Account management”.',signupChecking:'Registration successful. Checking permissions…',signupConfirm:'Registration successful. Please confirm your email before signing in.'}
};
const t=(k,...args)=>{let v=(I18N[lang]||I18N.zh)[k];return typeof v==='function'?v(...args):(v??k)};
const locale=()=>lang==='it'?'it-IT':lang==='en'?'en-US':'zh-CN';
function applyLanguage(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=t('adminTitle');$('langLogin').value=lang;$('langApp').value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));if(app.style.display!=='none')render();}
function setLanguage(v){lang=v;localStorage.setItem('tea_admin_lang',lang);applyLanguage();if(accounts.length)renderAccounts();}
$('langLogin').onchange=e=>setLanguage(e.target.value);$('langApp').onchange=e=>setLanguage(e.target.value);
const H=()=>{let h={apikey:KEY,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h};
async function auth(p,b){let r=await fetch(SB+'/auth/v1/'+p,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.msg||j.message||t('operationFailed'));return j}
async function rest(p,o={}){let r=await fetch(SB+'/rest/v1/'+p,{method:o.method||'GET',headers:H(),body:o.body!==undefined?JSON.stringify(o.body):undefined});if(!r.ok)throw Error(await r.text());if(r.status===204)return null;let tx=await r.text();return tx?JSON.parse(tx):null}
async function me(){let r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)throw Error(t('expired'));return r.json()}
async function boot(){try{user=await me();let a=await rest('admin_users?select=user_id&user_id=eq.'+user.id);if(!a.length){msg.textContent=t('noPermission');localStorage.removeItem('tea_token');token='';return}login.style.display='none';app.style.display='block';who.textContent=user.email||'';await load();applyLanguage()}catch(e){msg.textContent=e.message}}
async function load(){[store,services,hours,faqs,inq]=await Promise.all([rest('site_settings?singleton_key=eq.main&select=*').then(x=>x[0]),rest('services?select=*&order=sort_order.asc'),rest('business_hours?select=*&order=day_of_week.asc'),rest('faqs?select=*&order=sort_order.asc'),rest('inquiries?select=*&order=created_at.desc')]);render()}
function render(){['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>$(k).value=store[k]||'');servicesList.innerHTML=services.map(s=>'<div class="item"><label>'+t('title')+'<input id="st-'+s.id+'" value="'+E(s.title_it)+'"></label><label>'+t('description')+'<textarea id="sd-'+s.id+'">'+E(s.description_it||'')+'</textarea></label><label><input id="sa-'+s.id+'" type="checkbox" '+(s.active?'checked':'')+'> '+t('websiteVisible')+'</label><div class="row"><button class="btn" onclick="saveService(\''+s.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delService(\''+s.id+'\')">'+t('delete')+'</button></div></div>').join('');let names=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];hoursList.innerHTML=names.slice(1).map((n,i)=>{let d=i+1,h=hours.find(x=>x.day_of_week===d)||{day_of_week:d,day_name_it:n,published:false,open_time:'',close_time:''};return '<div class="item"><strong>'+h.day_name_it+'</strong><div class="formgrid"><label>'+t('start')+'<input id="ho-'+d+'" type="time" value="'+String(h.open_time||'').slice(0,5)+'"></label><label>'+t('end')+'<input id="hc-'+d+'" type="time" value="'+String(h.close_time||'').slice(0,5)+'"></label></div><label><input id="hp-'+d+'" type="checkbox" '+(h.published?'checked':'')+'> '+t('publicVisible')+'</label></div>'}).join('');faqsList.innerHTML=faqs.map(f=>'<div class="item"><label>'+t('question')+'<input id="fq-'+f.id+'" value="'+E(f.question_it)+'"></label><label>'+t('answer')+'<textarea id="fa-'+f.id+'">'+E(f.answer_it)+'</textarea></label><label><input id="fx-'+f.id+'" type="checkbox" '+(f.active?'checked':'')+'> '+t('websiteVisible')+'</label><div class="row"><button class="btn" onclick="saveFaq(\''+f.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delFaq(\''+f.id+'\')">'+t('delete')+'</button></div></div>').join('');inqList.innerHTML=inq.map(i=>'<div class="item"><strong>'+E(i.name||t('noName'))+'</strong><p>'+E(i.phone||'')+' '+E(i.email||'')+'</p><p>'+E(i.device||'')+'<br>'+E(i.message||'')+'</p><label>'+t('status')+'<select onchange="setInq(\''+i.id+'\',this.value)"><option value="new" '+(i.status==='new'?'selected':'')+'>'+t('newInq')+'</option><option value="contacted" '+(i.status==='contacted'?'selected':'')+'>'+t('contacted')+'</option><option value="closed" '+(i.status==='closed'?'selected':'')+'>'+t('closed')+'</option></select></label></div>').join('')||'<p>'+t('noInq')+'</p>'}
function renderAccounts(){accountsMsg.textContent=t('registeredCount',accounts.length);accountsList.innerHTML=accounts.map(a=>{const self=user&&a.user_id===user.id;const verified=a.email_confirmed?'<span class="badge ok">'+t('emailVerified')+'</span>':'<span class="badge no">'+t('emailUnverified')+'</span>';const admin=a.is_admin?'<span class="badge ok">'+t('admin')+'</span>':'<span class="badge">'+t('normalAccount')+'</span>';let action='';if(self)action='<span class="muted">'+t('selfAccount')+'</span>';else if(a.is_admin)action='<button class="btn danger" onclick="setAdmin(\''+a.user_id+'\',false)">'+t('revokeAdmin')+'</button>';else action='<button class="btn" onclick="setAdmin(\''+a.user_id+'\',true)">'+t('approveAdmin')+'</button>';return '<div class="item"><div class="account-head"><div><strong>'+E(a.email||t('noEmail'))+'</strong><div class="row" style="margin-top:8px">'+verified+admin+'</div></div><div>'+action+'</div></div><p class="muted">'+t('createdAt')+'：'+E(new Date(a.created_at).toLocaleString(locale()))+(a.last_sign_in_at?'　'+t('lastLogin')+'：'+E(new Date(a.last_sign_in_at).toLocaleString(locale())):'')+'</p></div>'}).join('')||'<p>'+t('noAccounts')+'</p>'}
async function loadAccounts(){accountsMsg.textContent=t('loadingAccounts');try{const [users,admins]=await Promise.all([rest('user_directory?select=*&order=created_at.desc'),rest('admin_users?select=user_id')]);const adminSet=new Set(admins.map(a=>a.user_id));accounts=users.map(a=>({...a,is_admin:adminSet.has(a.user_id)}));renderAccounts()}catch(e){accountsMsg.textContent=t('readFailed')+'：'+e.message}}
window.setAdmin=async(id,enabled)=>{if(!confirm(enabled?t('confirmApprove'):t('confirmRevoke')))return;try{if(enabled){await rest('admin_users',{method:'POST',body:{user_id:id,role:'admin'}})}else{await rest('admin_users?user_id=eq.'+id,{method:'DELETE'})}await loadAccounts()}catch(e){alert(e.message)}};
loginBtn.onclick=async()=>{try{let j=await auth('token?grant_type=password',{email:email.value.trim(),password:password.value});token=j.access_token;localStorage.setItem('tea_token',token);await boot()}catch(e){msg.textContent=e.message}};
signupBtn.onclick=async()=>{try{let j=await auth('signup',{email:email.value.trim(),password:password.value});msg.textContent=j.session?t('signupChecking'):t('signupConfirm');if(j.session){token=j.session.access_token;localStorage.setItem('tea_token',token);await boot()}}catch(e){msg.textContent=e.message}};
logoutBtn.onclick=()=>{localStorage.removeItem('tea_token');location.reload()};nav.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));$(e.target.dataset.tab).classList.add('active');if(e.target.dataset.tab==='accounts')loadAccounts()};refreshAccounts.onclick=loadAccounts;
saveStore.onclick=async()=>{let b={};['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>b[k]=$(k).value.trim());await rest('site_settings?singleton_key=eq.main',{method:'PATCH',body:b});storeMsg.textContent=t('saved');await load()};addService.onclick=async()=>{await rest('services',{method:'POST',body:{title_it:'Nuovo servizio',description_it:'',sort_order:services.length+1,active:true}});await load()};window.saveService=async id=>{await rest('services?id=eq.'+id,{method:'PATCH',body:{title_it:$('st-'+id).value,description_it:$('sd-'+id).value,active:$('sa-'+id).checked}});await load()};window.delService=async id=>{if(confirm(t('confirmDelete'))){await rest('services?id=eq.'+id,{method:'DELETE'});await load()}};saveHours.onclick=async()=>{let names=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];for(let d=1;d<=7;d++){let ex=hours.find(x=>x.day_of_week===d),b={day_of_week:d,day_name_it:names[d],open_time:$('ho-'+d).value||null,close_time:$('hc-'+d).value||null,published:$('hp-'+d).checked,sort_order:d};if(ex)await rest('business_hours?id=eq.'+ex.id,{method:'PATCH',body:b});else await rest('business_hours',{method:'POST',body:b})}await load()};addFaq.onclick=async()=>{await rest('faqs',{method:'POST',body:{question_it:'Nuova domanda',answer_it:'Nuova risposta',sort_order:faqs.length+1,active:true}});await load()};window.saveFaq=async id=>{await rest('faqs?id=eq.'+id,{method:'PATCH',body:{question_it:$('fq-'+id).value,answer_it:$('fa-'+id).value,active:$('fx-'+id).checked}});await load()};window.delFaq=async id=>{if(confirm(t('confirmDelete'))){await rest('faqs?id=eq.'+id,{method:'DELETE'});await load()}};window.setInq=async(id,status)=>{await rest('inquiries?id=eq.'+id,{method:'PATCH',body:{status}});await load()};
applyLanguage();if(token)boot();
</script>
</body></html>
