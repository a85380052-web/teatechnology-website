function renderPriceManager(){let b=priceBrandFilter.value||'',d=priceDeviceFilter.value||'',s=priceSeriesFilter.value||'',m=priceModelFilter.value||'',qf=priceQualityFilter.value||'',q=(priceSearch.value||'').trim().toLowerCase();let brands=[...new Set(prices.map(x=>x.brand).filter(Boolean))].sort();if(b&&!brands.includes(b))b='';priceBrandFilter.innerHTML=optionList(t('allBrands'),brands,b);let byBrand=prices.filter(x=>!b||x.brand===b),devices=[...new Set(byBrand.map(x=>x.device_type).filter(Boolean))].sort();if(d&&!devices.includes(d))d='';priceDeviceFilter.innerHTML=optionList(t('allDevices'),devices,d);let byDevice=byBrand.filter(x=>!d||x.device_type===d),series=[...new Set(byDevice.map(x=>x.series).filter(Boolean))].sort();if(s&&!series.includes(s))s='';priceSeriesFilter.innerHTML=optionList(t('allSeries'),series,s);let bySeries=byDevice.filter(x=>!s||x.series===s),models=[...new Set(bySeries.map(x=>x.model).filter(Boolean))].sort();if(m&&!models.includes(m))m='';priceModelFilter.innerHTML=optionList(t('allModels'),models,m);let byModel=bySeries.filter(x=>!m||x.model===m),qualities=[...new Set(byModel.map(x=>x.part_quality).filter(Boolean))].sort();if(qf&&!qualities.includes(qf))qf='';priceQualityFilter.innerHTML=optionList(t('allQualities'),qualities,qf,qualityText);let rows=prices.filter(x=>(!b||x.brand===b)&&(!d||x.device_type===d)&&(!s||x.series===s)&&(!m||x.model===m)&&(!qf||x.part_quality===qf));if(q)rows=rows.filter(x=>[x.brand,x.device_type,x.series,x.model,x.part_quality,x.service_name_it,x.source_note].some(v=>String(v||'').toLowerCase().includes(q)));priceCount.textContent=t('shown',rows.length);if(!rows.length){pricesList.innerHTML='<div class="price-empty">'+t('noPriceMatches')+'</div>';return}pricesList.innerHTML='<div class="table-wrap"><table class="price-table"><thead><tr><th>'+t('priceBrand')+'</th><th>'+t('device')+'</th><th>'+t('series')+'</th><th>'+t('model')+'</th><th>'+t('quality')+'</th><th>'+t('service')+'</th><th>'+t('price')+'</th><t function render(){['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>$(k).value=store[k]||'');servicesList.innerHTML=services.map(s=>'<div class="item"><label>'+t('service')+'<input id="st-'+s.id+'" value="'+E(s.title_it)+'"></label><label>'+t('source')+'<textarea id="sd-'+s.id+'">'+E(s.description_it||'')+'</textarea></label><label><input id="sa-'+s.id+'" type="checkbox" '+(s.active?'checked':'')+'> '+t('visible')+'</label><div class="row"><button class="btn" onclick="saveService(\''+s.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delService(\''+s.id+'\')">'+t('delete')+'</button></div></div>').join('');let names=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];hoursList.innerHTML=names.slice(1).map((n,i)=>{let d=i+1,h=hours.find(x=>x.day_of_week===d)||{day_name_it:n,published:false};return '<div class="item"><strong>'+E(h.day_name_it||n)+'</strong><div class="formgrid"><label>'+t('start')+'<input id="ho-'+d+'" type="time" value="'+String(h.open_time||'').slice(0,5)+'"></label><label>'+t('end')+'<input id="hc-'+d+'" type="time" value="'+String(h.close_time||'').slice(0,5)+'"></label></div><label><input id="hp-'+d+'" type="checkbox" '+(h.published?'checked':'')+'> '+t('public')+'</label></div>'}).join('');renderPriceManager();faqsList.innerHTML=faqs.map(f=>'<div class="item"><label>'+t('question')+'<input id="fq-'+f.id+'" value="'+E(f.question_it)+'"></label><label>'+t('answer')+'<textarea id="fa-'+f.id+'">'+E(f.answer_it)+'</textarea></label><label><input id="fx-'+f.id+'" type="checkbox" '+(f.active?'checked':'')+'> '+t('visible')+'</label><div class="row"><button class="btn" onclick="saveFaq(\''+f.id+'\')">'+t('save')+'</button><button class="btn danger" onclick="delFaq(\''+f.id+'\')">'+t('delete')+'</button></div></div>').join('');inqList.innerHTML=inq.map(i=>'<div class="item"><strong>'+E(i.name||'-')+'</strong><p>'+E(i.phone||'')+' '+E(i.email||'')+'</p><p>'+E(i.device||'')+'<br>'+E(i.message||'')+'</p><label>'+t('status')+'<select onchange="setInq(\''+i.id+'\',this.value)"><option value="new" '+(i.status==='new'?'selected':'')+'>'+t('new')+'</option><option value="contacted" '+(i.status==='contacted'?'selected':'')+'>'+t('contacted')+'</option><option value="closed" '+(i.status==='closed'?'selected':'')+'>'+t('closed')+'</option></select></label></div>').join('')}
priceBrandFilter.onchange=()=>{priceDeviceFilter.value='';priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';renderPriceManager()};priceDeviceFilter.onchange=()=>{priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';renderPriceManager()};priceSeriesFilter.onchange=()=>{priceModelFilter.value='';priceQualityFilter.value='';renderPriceManager()};priceModelFilter.onchange=()=>{priceQualityFilter.value='';renderPriceManager()};priceQualityFilter.onchange=renderPriceManager;priceSearch.oninput=renderPriceManager;clearPriceFilters.onclick=()=>{priceBrandFilter.value='';priceDeviceFilter.value='';priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';priceSearch.value='';renderPriceManager()};
async function loadAccounts(){accountsMsg.textContent='…';try{const [u,a]=await Promise.all([rest('user_directory?select=*&order=created_at.desc'),rest('admin_users?select=user_id')]),s=new Set(a.map(x=>x.user_id));accounts=u.map(x=>({...x,is_admin:s.has(x.user_id)}));renderAccounts()}catch(e){accountsMsg.textContent=e.message}}function renderAccounts(){accountsMsg.textContent=t('registered',accounts.length);accountsList.innerHTML=accounts.map(a=>{let self=user&&a.user_id===user.id,action=self?'<span class="muted">'+t('self')+'</span>':a.is_admin?'<button class="btn danger" onclick="setAdmin(\''+a.user_id+'\',false)">'+t('revoke')+'</button>':'<button class="btn" onclick="setAdmin(\''+a.user_id+'\',true)">'+t('approve')+'</button>';return '<div class="item"><div class="account-head"><div><strong>'+E(a.email||'-')+'</strong><div class="row" style="margin-top:8px"><span class="badge '+(a.email_confirmed?'ok':'no')+'">'+t(a.email_confirmed?'verified':'unverified')+'</span><span class="badge '+(a.is_admin?'ok':'')+'">'+t(a.is_admin?'admin':'normal')+'</span></div></div>'+action+'</div><p class="muted">'+E(new Date(a.created_at).toLocaleString(locale()))+'</p></div>'}).join('')}
window.setAdmin=async(id,on)=>{if(!confirm(on?t('confirmApprove'):t('confirmRevoke')))return;if(on)await rest('admin_users',{method:'POST',body:{user_id:id,role:'admin'}});else await rest('admin_users?user_id=eq.'+id,{method:'DELETE'});loadAccounts()};loginBtn.onclick=async()=>{try{let j=await auth('token?grant_type=password',{email:email.value.trim(),password:password.value});token=j.access_token;localStorage.setItem('tea_token',token);boot()}catch(e){msg.textContent=e.message}};signupBtn.onclick=async()=>{try{await auth('signup',{email:email.value.trim(),password:password.value});msg.textContent=t('signupOk')}catch(e){msg.textContent=e.message}};logoutBtn.onclick=()=>{localStorage.removeItem('tea_token');location.reload()};nav.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));$(e.target.dataset.tab).classList.add('active');if(e.target.dataset.tab==='accounts')loadAccounts()};refreshAccounts.onclick=loadAccounts;
saveStore.onclick=async()=>{let b={};['brand_name','phone','address','hero_title_it','hero_subtitle_it','logo_url'].forEach(k=>b[k]=$(k).value.trim());await rest('site_settings?singleton_key=eq.main',{method:'PATCH',body:b});storeMsg.textContent=t('saved');load()};addService.onclick=async()=>{await rest('services',{method:'POST',body:{title_it:'Nuovo servizio',description_it:'',sort_order:services.length+1,active:true}});load()};window.saveService=async id=>{await rest('services?id=eq.'+id,{method:'PATCH',body:{title_it:$('st-'+id).value,description_it:$('sd-'+id).value,active:$('sa-'+id).checked}});load()};window.delService=async id=>{if(confirm(t('confirmDelete'))){await rest('services?id=eq.'+id,{method:'DELETE'});load()}};saveHours.onclick=async()=>{let n=['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];for(let d=1;d<=7;d++){let ex=hours.find(x=>x.day_of_week===d),b={day_of_week:d,day_name_it:n[d],open_time:$('ho-'+d).value||null,close_time:$('hc-'+d).value||null,published:$('hp-'+d).checked,sort_order:d};if(ex)await rest('business_hours?id=eq.'+ex.id,{method:'PATCH',body:b});else await rest('business_hours',{method:'POST',body:b})}load()};addPrice.onclick=async()=>{await rest('repair_prices',{method:'POST',body:{brand:'Apple',device_type:'iPhone',series:'iPhone 16',model:'Nuovo modello',part_quality:'originale',service_key:'service_'+Date.now(),service_name_it:'Nuovo servizio',price_eur:0,sort_order:prices.length+1,active:false}});priceBrandFilter.value='';priceDeviceFilter.value='';priceSeriesFilter.value='';priceModelFilter.value='';priceQualityFilter.value='';priceSearch.value='';load()};window.savePrice=async id=>{await rest('repair_prices?id=eq.'+id,{method:'PATCH',body:{brand:$('pb-'+id).value.trim(),device_type:$('pd-'+id).value.trim(),series:$('ps-'+id).value.trim(),model:$('pm-'+id).value.trim(),part_quality:$('pq-'+id).value,service_name_it:$('pn-'+id).value.trim(),price_eur:Number($('pp-'+id).value||0),sort_order:Number($('po-'+id).value||0),source_note:$('px-'+id).value.trim(),active:$('pa-'+id).checked}});load()};window.delPrice=async id=>{if(confirm(t('confirmDelete'))){await rest('repair_prices?id=eq.'+id,{method:'DELETE'});load()}};addFaq.onclick=async()=>{await rest('faqs',{method:'POST',body:{question_it:'Nuova domanda',answer_it:'Nuova risposta',sort_order:faqs.length+1,active:true}});load()};window.saveFaq=async id=>{await rest('faqs?id=eq.'+id,{method:'PATCH',body:{question_it:$('fq-'+id).value,answer_it:$('fa-'+id).value,active:$('fx-'+id).checked}});load()};window.delFaq=async id=>{if(confirm(t('confirmDelete'))){await rest('faqs?id=eq.'+id,{method:'DELETE'});load()}};window.setInq=async(id,status)=>{await rest('inquiries?id=eq.'+id,{method:'PATCH',body:{status}});load()};applyLanguage();if(token)boot();
</script></body></html>
