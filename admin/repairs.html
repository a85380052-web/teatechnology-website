<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teatechnology 维修开单</title><style>:root{--b:#123b7a;--c:#20b9c9;--l:#dce9f2;--m:#657b8d;--bg:#f5fbff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:#17324d}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:16px}.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(90deg,var(--b),var(--c));color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.alt{background:#edf8fd;color:var(--b)}.danger{background:#fff1f0;color:#a52b20}.muted{color:var(--m);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:grid;gap:6px;font-size:14px;font-weight:700}input,textarea,select{border:1px solid #cddde8;border-radius:11px;padding:10px;font:inherit;background:#fff;width:100%}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:5px;font-weight:600;background:#f5fbff;border:1px solid var(--l);padding:8px 10px;border-radius:9px}.checks input{width:auto}.toolbar{display:grid;grid-template-columns:1fr 220px auto;gap:10px}.orders{display:grid;gap:10px}.order{border:1px solid var(--l);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px}.order h3{margin:0;color:var(--b)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf8fd;color:var(--b);font-size:12px;font-weight:800}.msg{padding:10px;border-radius:10px;background:#eef8fc;color:var(--m);margin-top:10px}.hidden{display:none!important}@media(max-width:760px){.formgrid,.formgrid.three,.toolbar,.order{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0;color:var(--b)">维修开单</h1><div class="muted">Teatechnology Repair Orders</div></div><div class="row"><a class="btn alt" href="./">返回后台</a><button id="newBtn" class="btn">＋ 新建维修单</button></div></div><section id="editor" class="card hidden"><div class="row" style="justify-content:space-between"><h2 id="editorTitle" style="margin:0;color:var(--b)">新建维修单</h2><button id="closeEditor" class="btn alt">关闭</button></div><div class="formgrid three" style="margin-top:16px"><label>客户姓名<input id="customer_name"></label><label>电话<input id="customer_phone"></label><label>设备类型<select id="device_type"><option value="telefonino">Telefonino</option><option value="tablet">Tablet</option><option value="computer">Computer</option><option value="altro">Altro</option></select></label><label>品牌<select id="brand"></select><input id="brand_custom" class="hidden" placeholder="手动输入品牌"></label><label>型号<select id="model"></select><input id="model_custom" class="hidden" placeholder="手动输入型号"></label><label>IMEI / Serial<input id="imei_serial"></label></div><label style="margin-top:14px">维修项目</label><div id="repairChecks" class="checks"></div><div class="formgrid" style="margin-top:14px"><label>客户描述 / 故障<textarea id="problem_description" rows="3"></textarea></label><label>备注<textarea id="notes" rows="3"></textarea></label><label>随机器材<input id="accessories" placeholder="Cover / SIM / caricatore..."></label><label>外观情况<input id="appearance_notes" placeholder="Schermo rotto, graffi..."></label></div><div class="formgrid three" style="margin-top:14px"><label>定金 €<input id="deposit_amount" type="number" step="0.01" value="0"></label><label>总价 €<input id="final_price" type="number" step="0.01"></label><label>配件成本 €<input id="parts_cost" type="number" step="0.01"></label><label>维修人员<input id="technician"></label><label>状态<select id="status"><option value="received">已收机</option><option value="diagnosing">检测中</option><option value="awaiting_customer">待客户确认</option><option value="awaiting_parts">等待配件</option><option value="repairing">维修中</option><option value="completed">已完成</option><option value="picked_up">已取机</option><option value="cancelled">取消</option></select></label></div><div class="checks" style="margin-top:14px"><label><input id="paid" type="checkbox"> 已付款</label><label><input id="picked_up" type="checkbox"> 已取机</label></div><div class="row" style="margin-top:16px"><button id="saveOrder" class="btn">保存维修单</button><button id="printOrder" class="btn alt hidden">打印维修单</button><button id="deleteOrder" class="btn danger hidden">删除</button></div><div id="editMsg" class="msg"></div></section><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="搜索单号 / 电话 / 客户 / 型号 / IMEI"><select id="statusFilter"><option value="">全部状态</option><option value="received">已收机</option><option value="diagnosing">检测中</option><option value="awaiting_customer">待客户确认</option><option value="awaiting_parts">等待配件</option><option value="repairing">维修中</option><option value="completed">已完成</option><option value="picked_up">已取机</option><option value="cancelled">取消</option></select><button id="refresh" class="btn alt">刷新</button></div><div id="count" class="muted" style="margin:12px 0"></div><div id="orders" class="orders"></div></section><section class="card"><details><summary style="cursor:pointer;font-weight:800;color:var(--b)">打印资料设置</summary><div class="formgrid" style="margin-top:14px"><label>打印抬头<input id="repair_header_it"></label><label>地址<input id="address"></label><label>电话<input id="phone"></label><label>第二电话<input id="repair_phone_secondary"></label><label>网站<input id="repair_website"></label><label>邮箱<input id="repair_email" type="email" placeholder="info@teatechnology.it"></label></div><label style="margin-top:12px">维修条款（意大利语）<textarea id="repair_terms_it" rows="8"></textarea></label><button id="savePrintSettings" class="btn">保存打印资料</button><div id="settingsMsg" class="msg"></div></details></section></div><script>const SB='https://pgnbacjlgnzmcsgfdxrn.supabase.co',KEY='sb_publishable_zMSq9XcCU_mChMK6hDuQLQ_vIP_jbaT';let token=localStorage.getItem('tea_token')||'',ordersData=[],repairCatalog=[],currentId=null,settings={};const $=x=>document.getElementById(x),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const TYPES=['Verifica','SIM Slot','Connettore','Altoparlante','LCD','Vetro','Microfono','Liquidi','Batteria','Tasti','Software','Altro'];const STATUS={received:'已收机',diagnosing:'检测中',awaiting_customer:'待客户确认',awaiting_parts:'等待配件',repairing:'维修中',completed:'已完成',picked_up:'已取机',cancelled:'取消'};const H=()=>({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'});async function rest(p,o={}){let r=await fetch(SB+'/rest/v1/'+p,{method:o.method||'GET',headers:H(),body:o.body===undefined?undefined:JSON.stringify(o.body)});if(!r.ok)throw Error(await r.text());if(r.status===204)return null;let t=await r.text();return t?JSON.parse(t):null}async function restAll(p){let all=[],offset=0,size=1000;for(;;){let batch=await rest(p+(p.includes('?')?'&':'?')+'limit='+size+'&offset='+offset);all.push(...batch);if(batch.length<size)return all;offset+=size}}function catalogValue(sel,custom){return sel.value==='__custom__'?custom.value.trim():sel.value.trim()}
function catalogGroup(t){
  t=String(t||'').toLowerCase();
  if(t==='iphone'||t==='smartphone')return 'telefonino';
  if(t==='ipad'||t==='tablet')return 'tablet';
  if(t==='macbook'||t==='computer'||t==='laptop'||t==='notebook'||t==='pc')return 'computer';
  return 'altro';
}
function filteredCatalog(){
  return repairCatalog.filter(x=>catalogGroup(x.device_type)===device_type.value);
}
function setCatalogSelection(currentBrand='',currentModel=''){
  let rows=filteredCatalog();
  let brands=[...new Set(rows.map(x=>x.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  brand.innerHTML='<option value="">请选择品牌</option>'+brands.map(x=>'<option value="'+E(x)+'">'+E(x)+'</option>').join('')+'<option value="__custom__">其他 / 手动输入</option>';
  if(currentBrand&&brands.includes(currentBrand)){
    brand.value=currentBrand;brand_custom.classList.add('hidden');brand_custom.value='';
  }else if(currentBrand){
    brand.value='__custom__';brand_custom.classList.remove('hidden');brand_custom.value=currentBrand;
  }else{
    brand.value='';brand_custom.classList.add('hidden');brand_custom.value='';
  }
  renderModelOptions(currentModel);
}
function renderModelOptions(currentModel=''){
  if(brand.value==='__custom__'){
    brand_custom.classList.remove('hidden');
    model.innerHTML='<option value="__custom__">其他 / 手动输入</option>';
    model.value='__custom__';model_custom.classList.remove('hidden');model_custom.value=currentModel||model_custom.value||'';
    return;
  }
  brand_custom.classList.add('hidden');
  let rows=filteredCatalog().filter(x=>!brand.value||x.brand===brand.value);
  let models=[...new Set(rows.map(x=>x.model).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  model.innerHTML='<option value="">请选择型号</option>'+models.map(x=>'<option value="'+E(x)+'">'+E(x)+'</option>').join('')+'<option value="__custom__">其他 / 手动输入</option>';
  if(currentModel&&models.includes(currentModel)){
    model.value=currentModel;model_custom.classList.add('hidden');model_custom.value='';
  }else if(currentModel){
    model.value='__custom__';model_custom.classList.remove('hidden');model_custom.value=currentModel;
  }else{
    model.value='';model_custom.classList.add('hidden');model_custom.value='';
  }
}
async function check(){if(!token){location.href='./';return false}let r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok){location.href='./';return false}let u=await r.json(),a=await rest('admin_users?select=user_id&user_id=eq.'+u.id);if(!a.length){location.href='./';return false}return true}function repairTypeUI(selected=[]){repairChecks.innerHTML=TYPES.map((x,i)=>'<label><input type="checkbox" class="rt" value="'+E(x)+'" '+(selected.includes(x)?'checked':'')+'> '+E(x)+'</label>').join('')}function num(v){return v===''?null:Number(v)}function clearForm(){currentId=null;editorTitle.textContent='新建维修单';['customer_name','customer_phone','imei_serial','problem_description','notes','accessories','appearance_notes','final_price','parts_cost','technician','brand_custom','model_custom'].forEach(x=>$(x).value='');device_type.value='telefonino';setCatalogSelection('','');deposit_amount.value='0';status.value='received';paid.checked=false;picked_up.checked=false;repairTypeUI([]);printOrder.classList.add('hidden');deleteOrder.classList.add('hidden');editMsg.textContent=''}function body(){return{customer_name:customer_name.value.trim(),customer_phone:customer_phone.value.trim(),device_type:device_type.value,brand:catalogValue(brand,brand_custom),model:catalogValue(model,model_custom),imei_serial:imei_serial.value.trim(),repair_types:[...document.querySelectorAll('.rt:checked')].map(x=>x.value),problem_description:problem_description.value.trim(),notes:notes.value.trim(),accessories:accessories.value.trim(),appearance_notes:appearance_notes.value.trim(),deposit_amount:num(deposit_amount.value)||0,final_price:num(final_price.value),parts_cost:num(parts_cost.value),technician:technician.value.trim(),status:status.value,paid:paid.checked,picked_up:picked_up.checked,paid_at:paid.checked?new Date().toISOString():null,picked_up_at:picked_up.checked?new Date().toISOString():null}}async function load(){[ordersData,settings,repairCatalog]=await Promise.all([rest('repair_orders?select=*&order=created_at.desc'),rest('site_settings?singleton_key=eq.main&select=*').then(x=>x[0]||{}),restAll('repair_prices?active=eq.true&select=device_type,brand,model')]);['repair_header_it','address','phone','repair_phone_secondary','repair_website','repair_email','repair_terms_it'].forEach(k=>$(k).value=settings[k]||'');render()}function render(){let q=search.value.trim().toLowerCase(),sf=statusFilter.value,rows=ordersData.filter(x=>(!sf||x.status===sf)&&(!q||[x.order_no,x.customer_name,x.customer_phone,x.brand,x.model,x.imei_serial].some(v=>String(v||'').toLowerCase().includes(q))));count.textContent='共 '+rows.length+' 张维修单';orders.innerHTML=rows.length?rows.map(x=>'<div class="order"><div><div class="row"><h3>'+E(x.order_no)+'</h3><span class="badge">'+E(STATUS[x.status]||x.status)+'</span></div><div style="margin-top:6px"><strong>'+E(x.customer_name||'-')+'</strong> · '+E(x.customer_phone||'-')+'</div><div class="muted">'+E([x.brand,x.model,x.device_type].filter(Boolean).join(' · '))+' · '+new Date(x.received_at).toLocaleString('it-IT')+'</div><div class="muted">'+E((x.repair_types||[]).join(' / '))+'</div></div><div class="row"><button class="btn alt" onclick="editOrder(\''+x.id+'\')">打开</button><button class="btn" onclick="printRepair(\''+x.id+'\')">打印</button></div></div>').join(''):'<div class="muted">暂无维修单</div>'}window.printRepair=id=>{let x=ordersData.find(v=>v.id===id);if(!x)return;try{localStorage.setItem('tea_print_payload',JSON.stringify({id,order:x,settings,at:Date.now()}))}catch(e){}window.open('repair-print.html?id='+encodeURIComponent(id)+'&autoprint=1&v='+Date.now(),'_blank')};window.editOrder=id=>{let x=ordersData.find(v=>v.id===id);if(!x)return;currentId=id;editor.classList.remove('hidden');editorTitle.textContent=x.order_no;['customer_name','customer_phone','imei_serial','problem_description','notes','accessories','appearance_notes','technician'].forEach(k=>$(k).value=x[k]||'');device_type.value=x.device_type||'telefonino';setCatalogSelection(x.brand||'',x.model||'');deposit_amount.value=x.deposit_amount??0;final_price.value=x.final_price??'';parts_cost.value=x.parts_cost??'';status.value=x.status||'received';paid.checked=!!x.paid;picked_up.checked=!!x.picked_up;repairTypeUI(x.repair_types||[]);printOrder.classList.remove('hidden');deleteOrder.classList.remove('hidden');editMsg.textContent='';editor.scrollIntoView({behavior:'smooth'})};newBtn.onclick=()=>{clearForm();editor.classList.remove('hidden');editor.scrollIntoView({behavior:'smooth'})};closeEditor.onclick=()=>editor.classList.add('hidden');saveOrder.onclick=async()=>{try{saveOrder.disabled=true;editMsg.textContent='保存中…';if(currentId)await rest('repair_orders?id=eq.'+currentId,{method:'PATCH',body:body()});else{let r=await rest('repair_orders?select=*',{method:'POST',body:body()});currentId=r&&r[0]?r[0].id:null}editMsg.textContent='已保存';await load();if(currentId)editOrder(currentId)}catch(e){editMsg.textContent=e.message}finally{saveOrder.disabled=false}};printOrder.onclick=()=>{if(currentId)printRepair(currentId)};deleteOrder.onclick=async()=>{if(!currentId||!confirm('确定删除这张维修单？'))return;await rest('repair_orders?id=eq.'+currentId,{method:'DELETE'});editor.classList.add('hidden');await load()};device_type.onchange=()=>{brand_custom.value='';model_custom.value='';setCatalogSelection('','')};brand.onchange=()=>{brand_custom.value='';renderModelOptions('')};model.onchange=()=>{if(model.value==='__custom__')model_custom.classList.remove('hidden');else{model_custom.classList.add('hidden');model_custom.value=''}};search.oninput=render;statusFilter.onchange=render;refresh.onclick=load;savePrintSettings.onclick=async()=>{let b={};['repair_header_it','address','phone','repair_phone_secondary','repair_website','repair_email','repair_terms_it'].forEach(k=>b[k]=$(k).value.trim());await rest('site_settings?singleton_key=eq.main',{method:'PATCH',body:b});settingsMsg.textContent='已保存';await load()};repairTypeUI([]);device_type.value='telefonino';setCatalogSelection('','');(async()=>{if(await check()){await load();device_type.value='telefonino';setCatalogSelection('','')}})()</script></body></html>
