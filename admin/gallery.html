<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页图片管理</title><style>:root{--b:#123b7a;--c:#20b9c9;--l:#dce9f2;--m:#657b8d;--bg:#f5fbff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:#17324d}.wrap{width:min(1000px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:16px}.btn{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(90deg,var(--b),var(--c));color:#fff;font-weight:800;cursor:pointer}.alt{background:#edf8fd;color:var(--b)}.danger{background:#fff1f0;color:#a52b20}.muted{color:var(--m);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:grid;gap:6px;font-weight:700;font-size:14px}input{border:1px solid #cddde8;border-radius:11px;padding:11px;font:inherit}.upload{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:180px 1fr auto;gap:16px;align-items:center;border:1px solid var(--l);border-radius:14px;padding:12px}.thumb{width:180px;height:112px;border-radius:12px;object-fit:cover;background:#eef8fc}.controls{display:grid;gap:8px}.msg{padding:10px;border-radius:10px;background:#eef8fc;color:var(--m);margin-top:10px}@media(max-width:760px){.upload,.item{grid-template-columns:1fr}.thumb{width:100%;height:190px}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0;color:var(--b)">首页图片管理</h1><div class="muted">上传后会自动用于首页轮播。支持 JPG / PNG / WebP，单张不超过 5MB。</div></div><a class="btn alt" href="./">返回后台</a></div><div class="card"><div class="upload"><label>选择图片<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><label>图片说明（意大利语）<input id="alt" placeholder="Interno del negozio Teatechnology"></label><button id="uploadBtn" class="btn">上传图片</button></div><div id="msg" class="msg">请先从后台登录后再进入此页面。</div></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0;color:var(--b)">轮播图片</h2><button id="refresh" class="btn alt">刷新</button></div><div id="list" class="list" style="margin-top:14px"></div></div></div><script>const SB='https://pgnbacjlgnzmcsgfdxrn.supabase.co',KEY='sb_publishable_zMSq9XcCU_mChMK6hDuQLQ_vIP_jbaT';let token=localStorage.getItem('tea_token')||'',items=[];const $=x=>document.getElementById(x),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const H=()=>({apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'});async function rest(p,o={}){let r=await fetch(SB+'/rest/v1/'+p,{method:o.method||'GET',headers:H(),body:o.body!==undefined?JSON.stringify(o.body):undefined});if(!r.ok)throw Error(await r.text());if(r.status===204)return null;let t=await r.text();return t?JSON.parse(t):null}async function check(){if(!token){location.href='./';return false}let r=await fetch(SB+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok){location.href='./';return false}let u=await r.json(),a=await rest('admin_users?select=user_id&user_id=eq.'+u.id);if(!a.length){location.href='./';return false}msg.textContent='已登录，可以上传和管理首页图片。';return true}function storagePath(url){let mark='/storage/v1/object/public/site-media/';let i=url.indexOf(mark);return i<0?'':decodeURIComponent(url.slice(i+mark.length))}async function load(){items=await rest('media_assets?asset_type=eq.hero_gallery&select=*&order=sort_order.asc,created_at.asc');render()}function render(){list.innerHTML=items.length?items.map((x,i)=>'<div class="item"><img class="thumb" src="'+E(x.file_url)+'" alt=""><div class="controls"><label>说明<input id="alt-'+x.id+'" value="'+E(x.alt_text_it||'')+'"></label><label>顺序<input id="sort-'+x.id+'" type="number" value="'+Number(x.sort_order||i+1)+'"></label><label><span><input id="active-'+x.id+'" type="checkbox" '+(x.active?'checked':'')+'> 在网站显示</span></label></div><div class="controls"><button class="btn" onclick="saveItem(\''+x.id+'\')">保存</button><button class="btn alt" onclick="moveItem(\''+x.id+'\',-1)">上移</button><button class="btn alt" onclick="moveItem(\''+x.id+'\',1)">下移</button><button class="btn danger" onclick="delItem(\''+x.id+'\')">删除</button></div></div>').join(''):'<div class="muted">还没有图片。上传第一张后，首页会自动开始显示。</div>'}uploadBtn.onclick=async()=>{try{let f=file.files[0];if(!f)throw Error('请选择图片');if(f.size>5*1024*1024)throw Error('图片不能超过 5MB');if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('只支持 JPG / PNG / WebP');uploadBtn.disabled=true;msg.textContent='正在上传…';let ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');let path='hero/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;let r=await fetch(SB+'/storage/v1/object/site-media/'+encodeURIComponent(path).replace(/%2F/g,'/'),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok)throw Error(await r.text());let url=SB+'/storage/v1/object/public/site-media/'+path;let max=items.reduce((m,x)=>Math.max(m,Number(x.sort_order)||0),0);await rest('media_assets',{method:'POST',body:{label_zh:'首页轮播图',file_url:url,alt_text_it:alt.value.trim(),asset_type:'hero_gallery',sort_order:max+1,active:true}});file.value='';alt.value='';msg.textContent='上传成功。';await load()}catch(e){msg.textContent=e.message}finally{uploadBtn.disabled=false}};window.saveItem=async id=>{await rest('media_assets?id=eq.'+id,{method:'PATCH',body:{alt_text_it:$('alt-'+id).value.trim(),sort_order:Number($('sort-'+id).value)||0,active:$('active-'+id).checked}});await load()};window.moveItem=async(id,dir)=>{let i=items.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=items.length)return;let a=items[i],b=items[j],sa=Number(a.sort_order)||i+1,sb=Number(b.sort_order)||j+1;await rest('media_assets?id=eq.'+a.id,{method:'PATCH',body:{sort_order:sb}});await rest('media_assets?id=eq.'+b.id,{method:'PATCH',body:{sort_order:sa}});await load()};window.delItem=async id=>{if(!confirm('确定删除这张图片？'))return;let x=items.find(v=>v.id===id),p=x?storagePath(x.file_url):'';if(p){let r=await fetch(SB+'/storage/v1/object/site-media/'+encodeURIComponent(p).replace(/%2F/g,'/'),{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)console.warn(await r.text())}await rest('media_assets?id=eq.'+id,{method:'DELETE'});await load()};refresh.onclick=load;(async()=>{if(await check())await load()})()</script></body></html>
